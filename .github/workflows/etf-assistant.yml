name: ETF Investment Assistant

on:
  workflow_dispatch:   # 由 cron-job.org 或手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =============================================
      # 缓存 record.json，实现跨运行防重复推送
      # =============================================
      - name: Cache record.json
        uses: actions/cache@v4
        with:
          path: record.json
          key: etf-record-${{ github.run_id }}
          restore-keys: |
            etf-record-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install akshare requests pandas

      - name: Run ETF Assistant
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python investment_alert.py
