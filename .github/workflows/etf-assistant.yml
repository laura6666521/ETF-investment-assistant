name: ETF Investment Assistant

on:
  workflow_dispatch:   # 只保留手动/API触发，彻底放弃内置定时

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          pip install akshare requests

      - name: Run
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python investment_alert.py
