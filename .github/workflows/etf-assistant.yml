name: ETF Investment Assistant

on:
  workflow_dispatch:   # 由 cron-job.org 或手动触发

permissions:
  contents: write       # 允许保存 record.json

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install akshare requests pandas

      - name: Run ETF Assistant
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python investment_alert.py

      # =============================================
      # 保存 record.json，防止重复提醒
      # =============================================
      - name: Save record.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add record.json

          git commit -m "Update ETF record" || exit 0

          git push
