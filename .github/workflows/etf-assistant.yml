name: ETF Investment Assistant

on:
  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 10 * * 1-5"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          pip install akshare requests

      - name: Run
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python investment_alert.py
