name: ETF Investment Assistant


on:

  schedule:

    # 北京时间11:00
    - cron: "0 3 * * 1-5"

    # 北京时间14:40
    - cron: "40 6 * * 1-5"

    # 北京时间15:50 收盘复盘
    - cron: "50 7 * * 1-5"


  workflow_dispatch:


jobs:

  run-etf:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # 缓存Python依赖，加快运行
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip


      - name: Install packages
        run: |
          pip install -r requirements.txt


      - name: Run ETF Assistant
        env:

          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}

        run: |

          python investment_alert.py
